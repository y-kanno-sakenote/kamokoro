<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>醸しコロ</title>
<style>
  :root{
    --bg:#12100e; --panel:#1e1a16; --line:#3a322a;
    --fg:#f3ece2; --sub:#a99a86; --accent:#e8b04b; --hp:#7fc98a; --hp2:#d96b5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:430px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  h1{font-size:26px;margin:6px 0 2px;letter-spacing:.08em}
  .lead{color:var(--sub);font-size:13px;margin:0 0 10px}
  /* 蔵めぐりの進み（●○） */
  .runbar{font-size:13px;color:var(--accent);margin:0 0 8px;letter-spacing:.12em;min-height:18px}
  .runbar b{font-weight:400;color:var(--sub);letter-spacing:0;margin-left:6px}

  /* 1. キャラ選択 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer}
  .card:active{transform:scale(.97)}
  .card.off{opacity:.3;cursor:default}
  .card .em{font-size:40px;line-height:1.1}
  .card .nm{font-size:15px;font-weight:700;margin-top:4px}
  .card .tp{font-size:11px;color:var(--sub);margin-top:3px}
  .card .at{font-size:11px;color:var(--accent);margin-top:2px;font-weight:700}
  .card .hp{font-size:12px;color:var(--accent);margin-top:4px}
  .card .fc{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5;letter-spacing:.03em}
  .card .go{font-size:11px;color:var(--accent);margin-top:4px}

  /* 2. 準備 */
  .prow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:6px}
  .prow .em{font-size:24px}
  .prow .hp{font-weight:400;font-size:12px;color:var(--accent)}
  .prow .at{font-weight:700;font-size:12px;color:var(--accent)}
  .ttl{font-size:11px;color:var(--sub);margin:8px 0 4px}
  .ttl span{color:var(--accent)}
  .pool{display:flex;flex-direction:column;gap:4px}
  .pv{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:5px 8px;cursor:pointer;line-height:1.25}
  .pv:active{transform:scale(.99)}
  .pv.sel{border-color:var(--accent);background:#2a2318}
  .pv .g{font-size:9px;color:var(--sub);width:30px;flex:none;text-align:center}
  .pv.sel .g{color:var(--accent)}
  .pv .n{font-size:13px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv .c{font-size:12px;color:var(--sub);white-space:nowrap}
  .pv .c b{color:var(--fg);margin-left:3px}
  .pv .o{font-size:11px;color:var(--accent);white-space:nowrap;width:76px;flex:none;text-align:right}
  .pv .wn{font-size:9px}

  /* 準備: エネコロ3個（左・中・右）を3行で。1行＝固定3面（🔒属性×2＋✨）＋カスタム3面（v6） */
  .dierow{display:flex;align-items:center;gap:5px;margin-top:4px}
  .dierow .dl{font-size:11px;color:var(--sub);width:12px;flex:none;text-align:center}
  .facebar{flex:1;display:flex;gap:4px}
  .fs{flex:1;min-width:0;height:38px;border-radius:9px;background:var(--panel);border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .fs .v{font-size:19px;line-height:1}
  .fs.chip{border-color:var(--accent)}
  /* 固定3面（属性×2＋✨）＝🔒。押せない */
  .fs.fix{cursor:default;border-style:dashed;background:#181410}
  /* 🔒3面とカスタム3面のあいだに切れ目を入れる */
  .fs.cut{margin-left:7px}
  .fs .lk{position:absolute;top:1px;right:3px;font-size:8px;opacity:.65;line-height:1}
  .inv{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
  .inv span.z{opacity:.35}
  .inv b{color:var(--fg);font-weight:700}
  .inv i{font-style:normal;opacity:.6}

  /* チップ選択シート */
  .sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;
    align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheetin{width:100%;max-width:430px;background:var(--panel);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .sheetin h3{font-size:14px;margin:0 0 10px;font-weight:700}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer}
  .chip .v{font-size:19px;line-height:1.1}
  .chip .v.two{font-size:14px;letter-spacing:-1px}
  .chip .k{font-size:10px;color:var(--sub);margin-top:2px}
  .chip.z{opacity:.3;cursor:default}
  .chip.on{border-color:var(--accent)}
  .sheetbtns{display:flex;gap:8px;margin-top:10px}
  .sheetbtns .btn{margin-top:0;max-width:none}

  /* 3. バトル */
  .fighter{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .fighter .em{font-size:38px}
  .fighter .info{flex:1;min-width:0}
  .fighter .nm{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:6px}
  .fighter .n{white-space:nowrap}
  .fighter .hpn{font-weight:400;color:var(--sub);font-size:12px;white-space:nowrap}
  .fighter .at{font-weight:700;color:var(--accent);font-size:11px;white-space:nowrap}
  .bar{height:9px;background:#2c2620;border-radius:5px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--hp);transition:width .35s}
  .bar i.low{background:var(--hp2)}
  .badge{flex:1;text-align:right;font-size:11px;font-weight:400;color:var(--accent);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hit{animation:hit .4s}
  @keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* ダイス置き場: 相手（上・小さめ）と自分（下）で別々に持つ */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    gap:5px;padding:4px 0;min-height:0}
  .stage.foe{justify-content:flex-start}   /* 相手のHPバーのすぐ下 */
  .stage.me{justify-content:flex-end}      /* 自分のHPバーのすぐ上 */
  .turnlb{font-size:12px;color:var(--sub);min-height:16px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .dicerow{display:flex;gap:12px;align-items:flex-start;justify-content:center;padding:7px 0}
  .ens{display:flex;gap:7px;align-items:flex-start}
  /* ダイス1個＋その個の6面（真下に小さく）。3個それぞれ面構成が違うので個別に出す */
  .dcol{display:flex;flex-direction:column;align-items:center;gap:3px}
  .fl{font-size:10px;line-height:1.15;color:var(--sub);text-align:center;
    letter-spacing:-.5px;white-space:nowrap}
  .stage.foe .fl{font-size:9px}
  /* 立方体ダイス: .die=枠（奥行き） / .cube=回る本体 / .f=6面 */
  .die{position:relative;flex:none;perspective:520px}
  .die.big{width:76px;height:76px;font-size:40px;--h:38px;--r:8px}
  .die.en{width:46px;height:46px;font-size:24px;--h:23px;--r:7px}
  .cube{position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform 520ms cubic-bezier(.22,.72,.3,1)}
  .f{position:absolute;inset:0;border-radius:var(--r);background:var(--panel);
    border:3px solid var(--line);display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .die.big .f{border-color:var(--accent)}
  .die.en .f{border-width:2px}
  .f .two{font-size:.62em;letter-spacing:-1px}
  /* キャラコロの面＝漢字1文字（静・湧・沸・躍・極。勢いが上がっていく順） */
  .f .kj{font-size:.86em;font-weight:700;line-height:1;color:var(--fg)}
  .f0{transform:translateZ(var(--h))}
  .f1{transform:rotateY(180deg) translateZ(var(--h))}
  .f2{transform:rotateY(90deg) translateZ(var(--h))}
  .f3{transform:rotateY(-90deg) translateZ(var(--h))}
  .f4{transform:rotateX(90deg) translateZ(var(--h))}
  .f5{transform:rotateX(-90deg) translateZ(var(--h))}
  .dcol.off{opacity:.22}
  .die.bnc{animation:dbounce .18s ease-out}
  @keyframes dbounce{0%{transform:translateY(0)}40%{transform:translateY(-5px)}100%{transform:translateY(0)}}
  /* 相手側は一回り小さく */
  .stage.foe .die.big{width:60px;height:60px;font-size:32px;--h:30px;--r:7px}
  .stage.foe .die.en{width:37px;height:37px;font-size:19px;--h:18.5px;--r:6px}
  .stage.foe .die .f{border-width:2px}
  /* 手番でない側は薄く残す（直前の出目は消さない） */
  .stage.dim .dcol{opacity:.45}
  .stage.dim .dcol.off{opacity:.14}
  .stage.dim .result{opacity:.45}
  .stage.dim .turnlb{opacity:.6}
  /* 動きを減らす設定では回さずに即座に出目を出す */
  @media (prefers-reduced-motion: reduce){
    .cube{transition:none !important}
    .die.bnc{animation:none !important}
  }
  .result{font-size:17px;font-weight:700;min-height:22px;line-height:1.3;text-align:center}
  .stage.foe .result{font-size:14px;min-height:19px}
  /* 技ボタン: 技名 / コスト 威力　向き→おまけ の2段 */
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .mv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    color:var(--fg);font-family:inherit;text-align:left;cursor:pointer;line-height:1.35}
  .mv:active{transform:scale(.97)}
  .mv:disabled{opacity:.32;cursor:default}
  .mv.used{opacity:.5}
  .mv .n{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mv .tag{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:2px}
  .mv .c{font-size:12px;color:var(--sub);display:block;margin-top:2px;white-space:nowrap}
  .mv .c b{color:var(--fg)}
  .mv .o{color:var(--accent);font-style:normal}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    font-size:13px;line-height:1.7;min-height:74px;margin-top:10px}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
  .log div:last-child{color:var(--fg)}

  /* 4. 結果 */
  .endbox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
  .endbox .big{font-size:56px}
  .endbox .msg{font-size:24px;font-weight:700}
  .endbox .got{font-size:17px;color:var(--accent);min-height:24px}
  .endbox .dots{font-size:14px;color:var(--sub);letter-spacing:.12em}
  .btn{background:var(--accent);color:#221a0c;border:0;border-radius:12px;padding:13px 22px;
    font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;width:100%;max-width:260px}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.sub{background:transparent;color:var(--sub);border:1px solid var(--line)}
  #s-prep .btn{max-width:none;margin-top:10px}
</style>
</head>
<body>
<div id="app">

  <!-- 1. キャラ選択 -->
  <section id="s-select" class="screen on">
    <h1>醸しコロ</h1>
    <p class="lead">酵母を1体えらぶ。蔵をめぐって6体たおす。</p>
    <div class="runbar" id="sel-run"></div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 2. 準備 -->
  <section id="s-prep" class="screen">
    <div class="runbar" id="prep-run"></div>
    <div class="prow" id="prep-char"></div>
    <div class="ttl">わざを4つえらぶ <span id="prep-cnt"></span></div>
    <div class="pool" id="prep-pool"></div>
    <div class="ttl">エネコロ3個（左から振る・🔒は固定3面）</div>
    <div id="prep-dice"></div>
    <div class="ttl">チップ <span id="prep-used"></span></div>
    <div class="inv" id="prep-inv"></div>
    <button class="btn" id="go">たたかう</button>
  </section>

  <!-- 3. バトル -->
  <section id="s-battle" class="screen">
    <div class="fighter" id="f-foe">
      <div class="em"></div>
      <div class="info"><div class="nm"><span class="n"></span><span class="at"></span><span class="badge"></span><span class="hpn"></span></div>
        <div class="bar"><i></i></div></div>
    </div>

    <!-- 相手のダイス置き場（相手のHPバーのすぐ下） -->
    <div class="stage foe dim" id="stage-foe">
      <div class="turnlb" id="lb-foe"></div>
      <div class="dicerow">
        <div class="dcol"><div class="die big" id="dchar-foe"></div><div class="fl" id="fl-foe-c"></div></div>
        <div class="ens" id="denergy-foe"></div>
      </div>
      <div class="result" id="res-foe"></div>
    </div>

    <!-- 自分のダイス置き場（自分のHPバーのすぐ上） -->
    <div class="stage me dim" id="stage-me">
      <div class="turnlb" id="lb-me"></div>
      <div class="dicerow">
        <div class="dcol"><div class="die big" id="dchar-me"></div><div class="fl" id="fl-me-c"></div></div>
        <div class="ens" id="denergy-me"></div>
      </div>
      <div class="result" id="res-me"></div>
    </div>

    <div class="fighter" id="f-me">
      <div class="em"></div>
      <div class="info"><div class="nm"><span class="n"></span><span class="at"></span><span class="badge"></span><span class="hpn"></span></div>
        <div class="bar"><i></i></div></div>
    </div>

    <div class="moves" id="moves"></div>
    <div class="log" id="log"></div>
  </section>

  <!-- 4. 結果 -->
  <section id="s-end" class="screen">
    <div class="endbox">
      <div class="big" id="end-em"></div>
      <div class="msg" id="end-msg"></div>
      <div class="got" id="end-got"></div>
      <div class="dots" id="end-dots"></div>
      <button class="btn" id="again"></button>
      <button class="btn sub" id="toselect"></button>
    </div>
  </section>

</div>

<!-- チップ選択シート -->
<div class="sheet" id="sheet">
  <div class="sheetin">
    <h3 id="sheet-ttl">この面にはめるチップ</h3>
    <div class="chips" id="sheet-chips"></div>
    <div class="sheetbtns">
      <button class="btn sub" id="sheet-off">はずす</button>
      <button class="btn sub" id="sheet-close">とじる</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.KamoshiEngine;
  var ME = 0, FOE = 1;
  var LAP = 6; // 1周で倒す相手の数

  // ---------------- 保存（localStorage・1キーだけ） ----------------
  var SKEY = 'kamoshi-koro:v3';
  var SVER = 6;   // v6: 固定3面（属性2＋✨1）＋カスタム3面・✨チップ廃止・チップ12枚。旧版（v5以前）は読まずに初期化する
  var save = null;

  function freshSave(){
    // 手持ちチップ（12枚）は「最初にキャラを選んだとき」に配る（キャラごとに内訳が違うため）
    var s = { v:SVER, chips:{}, dice:{}, moves:{}, run:null, granted:false };
    E.CHIP_ORDER.forEach(function(k){ s.chips[k] = 0; });
    E.CHARS.forEach(function(c){
      s.dice[c.id] = E.normalizeChips(null);   // 3個 × 6スロット（既定は3個とも素の面＝空白ではない）
      s.moves[c.id] = c.star.slice();
    });
    return s;
  }
  // スロット6つ（null か チップキーの文字列）
  function okSlots(a){
    if (!Array.isArray(a) || a.length !== E.SLOTS_N) return false;
    for (var i = 0; i < E.SLOTS_N; i++) if (a[i] !== null && typeof a[i] !== 'string') return false;
    return true;
  }
  // dice は「3個 × 6スロット」。形が違えば validSave が false ＝丸ごと初期化（v3以前は読まない）
  function okDice(d){
    if (!Array.isArray(d) || d.length !== E.DICE_N) return false;
    for (var i = 0; i < E.DICE_N; i++) if (!okSlots(d[i])) return false;
    return true;
  }
  function validSave(s){
    if (!s || s.v !== SVER || !s.chips || !s.dice || !s.moves) return false;
    if (typeof s.granted !== 'boolean') return false;
    var i, ok = true;
    for (i = 0; i < E.CHIP_ORDER.length; i++){
      var n = s.chips[E.CHIP_ORDER[i]];
      if (typeof n !== 'number' || !isFinite(n) || n < 0 || n % 1 !== 0) return false;
    }
    E.CHARS.forEach(function(c){
      var d = s.dice[c.id], m = s.moves[c.id];
      // 未知のチップキー（廃止された2エネ等の旧セーブ）はここで弾かず repairAllSlots に素の面へ戻させる
      if (!okDice(d)) { ok = false; return; }
      if (!Array.isArray(m) || m.length !== 4) { ok = false; return; }
      var seen = {};
      for (var k = 0; k < 4; k++){
        // 整数以外（5.5 等）は base.moves[i] が undefined になりバトルで落ちるので弾く
        if (typeof m[k] !== 'number' || m[k] % 1 !== 0 || m[k] < 0 || m[k] >= c.moves.length || seen[m[k]]) { ok = false; return; }
        seen[m[k]] = 1;
      }
    });
    if (!ok) return false;
    if (s.run !== null){
      var r = s.run;
      if (!r || !E.getChar(r.charId) || !Array.isArray(r.rest) || typeof r.wins !== 'number') return false;
      if (r.wins < 0 || r.wins > LAP || r.rest.length + r.wins !== LAP) return false;
      for (var q = 0; q < r.rest.length; q++) if (!E.getChar(r.rest[q])) return false;
      if (r.lap != null && (typeof r.lap !== 'number' || r.lap < 1)) return false; // 旧セーブは lap 無し＝1周目扱い
    }
    return true;
  }
  function loadSave(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SKEY)); } catch(e) { s = null; }
    if (!validSave(s)) s = freshSave();   // 壊れている・v3以前 → 丸ごと捨てて初期化（例外は出さない）
    E.CHARS.forEach(function(c){ s.dice[c.id] = E.normalizeChips(s.dice[c.id]); });
    repairAllSlots(s);                    // 上限違反（1個ごとに 属性3面・他2面）があれば素の面へ戻す
    if (s.run && s.run.lap == null) s.run.lap = 1;
    return s;
  }
  // 旧セーブ等でカスタム上限を超えている構成があれば直し、外したチップは在庫に戻す
  function repairAllSlots(s){
    E.CHARS.forEach(function(c){
      var r = E.repairSlots(c, s.dice[c.id]);
      if (r.removed.length){
        s.dice[c.id] = r.chips;
        r.removed.forEach(function(k){ s.chips[k] = (s.chips[k] || 0) + 1; });
      }
    });
  }
  function writeSave(){
    try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch(e) {}
  }
  save = loadSave();

  // ---------------- 小物 ----------------
  var st = null, myF = null, foeF = null, busy = false, logs = [], prepChar = null;
  var sheetDie = -1, sheetSlot = -1;
  var lastGot = [];

  function $(id){ return document.getElementById(id); }
  function show(id){
    ['s-select','s-prep','s-battle','s-end'].forEach(function(s){ $(s).classList.toggle('on', s===id); });
    window.scrollTo(0,0);
  }
  function oKan(k){ return E.ORIENT[k].kanji; }      // 静湧沸躍極（勢いが上がっていく順）
  function en(k){ return E.ENERGY[k].emoji; }
  // 3個ぶんの面構成（キャラ選択カード用）。3個とも同じなら1行にまとめる（初期はいつも1行）
  function facesLines(f){
    var ls = f.energy.map(function(d){
      return E.SLOT_ORDER.map(function(i){ return E.faceEmoji(d[i]); }).join('');
    });
    var same = ls[0] === ls[1] && ls[1] === ls[2];
    return same ? ls[0] : ls.join('<br>');
  }
  function dieFaces(c){ return c.die.map(oKan).join(''); }
  function dots(wins){
    var s = '';
    for (var i = 0; i < LAP; i++) s += (i < wins ? '●' : '○');
    return s;
  }
  function runLine(){
    if (!save.run) return '';
    return '蔵めぐり ' + dots(save.run.wins) + '<b>' + save.run.wins + '勝</b>';
  }
  function shuffled(rngless){
    var a = E.CHARS.map(function(c){ return c.id; });
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function loadOf(id){ return { moves: save.moves[id], chips: save.dice[id] }; }

  // ---------------- 1. キャラ選択 ----------------
  function drawSelect(){
    $('sel-run').innerHTML = runLine();
    var box = $('cards');
    box.innerHTML = '';
    E.CHARS.forEach(function(c){
      var live = !save.run || save.run.charId === c.id;
      var f = E.buildFighter(c.id, loadOf(c.id));
      var d = document.createElement('div');
      d.className = 'card' + (live ? '' : ' off');
      d.innerHTML = '<div class="em">'+c.emoji+'</div><div class="nm">'+c.name+'</div>'+
                    '<div class="tp">'+c.type+'</div>'+
                    '<div class="at">'+E.attrLabel(c.attr)+'</div><div class="hp">HP '+c.hp+'</div>'+
                    '<div class="fc">'+facesLines(f)+'<br>'+dieFaces(c)+'</div>'+
                    (save.run && live ? '<div class="go">つづきから</div>' : '');
      if (live) d.onclick = function(){ chooseChar(c.id); };
      box.appendChild(d);
    });
  }

  function chooseChar(id){
    // 手持ちチップ12枚（属性3＋他3種で9・キャラごとに偏る）。初回だけ・選ぶピッカーは作らない
    if (!save.granted){
      var g = E.startChips(id);
      E.CHIP_ORDER.forEach(function(k){ save.chips[k] += g[k]; });
      save.granted = true;
      writeSave();
    }
    if (!save.run) save.run = { charId: id, rest: shuffled(), wins: 0, lap: 1 };
    goPrep();
  }

  // ---------------- 2. 準備 ----------------
  function goPrep(){
    prepChar = E.getChar(save.run.charId);
    drawPrep();
    show('s-prep');
  }

  function moveLabel(mv){
    if (mv.kind === 'heal') return '回復' + mv.power;
    if (mv.kind === 'guard') return '半減';
    return String(mv.power);
  }
  function orientLabel(mv){
    var e = mv.eff || {}, s = E.hitLabel(mv.hit);
    if (e.plus) return s + '+' + e.plus;
    if (e.healPlus) return s + '回復+' + e.healPlus;
    if (e.heal) return s + '回復' + e.heal;
    if (e.self) return s + '自分に' + e.self;
    if (e.minus) return s + '相手🎲-1';
    if (e.guard) return s + '半減';
    return s;
  }
  // そのエネの面を1面も持っていないか（✨は穴埋めなので「持っている」には数えない）
  function missingSet(){
    var dice = E.buildEnergy(prepChar, save.dice[prepChar.id]);   // 3個ぶん
    var have = {};
    dice.forEach(function(faces){
      faces.forEach(function(f){ f.forEach(function(k){ have[k] = 1; }); });
    });
    return { has: function(k){ return !!have[k]; } };
  }
  // ⚠️は「選んだ4技」のコストにだけ出す（禁止はしない）
  function costHtml(mv, miss, sel){
    return mv.cost.map(function(k){
      return en(k) + (sel && !miss.has(k) ? '<span class="wn">⚠️</span>' : '');
    }).join('');
  }

  function drawPrep(){
    var id = prepChar.id, sel = save.moves[id], miss = missingSet();
    $('prep-run').innerHTML = runLine();
    $('prep-char').innerHTML = '<span class="em">'+prepChar.emoji+'</span>'+prepChar.name+
      '<span class="at">'+E.attrLabel(prepChar.attr)+'</span>'+
      '<span class="hp">HP '+prepChar.hp+'</span>';
    $('prep-cnt').textContent = sel.length + '/4';

    var pool = $('prep-pool');
    pool.innerHTML = '';
    prepChar.moves.forEach(function(mv, i){
      var on = sel.indexOf(i) >= 0;
      var d = document.createElement('div');
      d.className = 'pv' + (on ? ' sel' : '');
      d.innerHTML = '<span class="g">'+E.GROUP[mv.g]+'</span>'+
        '<span class="n">'+mv.name+'</span>'+
        '<span class="c">'+costHtml(mv, miss, on)+'<b>'+moveLabel(mv)+'</b></span>'+
        '<span class="o">'+orientLabel(mv)+'</span>';
      d.onclick = function(){ toggleMove(i); };
      pool.appendChild(d);
    });

    // エネコロ3個（左・中・右）。1行＝🔒固定3面（属性×2＋✨）＋カスタム3面。並びは SLOT_ORDER
    var dice = E.buildEnergy(prepChar, save.dice[id]);
    var bar = $('prep-dice');
    bar.innerHTML = '';
    var placed = 0;
    dice.forEach(function(faces, di){
      var row = document.createElement('div');
      row.className = 'dierow';
      var lab = document.createElement('div');
      lab.className = 'dl';
      lab.textContent = E.DICE_LABEL[di];
      row.appendChild(lab);
      var fb = document.createElement('div');
      fb.className = 'facebar';
      E.SLOT_ORDER.forEach(function(slot, pos){
        var chip = save.dice[id][di][slot], fixed = E.isFixedSlot(slot);
        if (chip) placed++;
        var d = document.createElement('div');
        d.className = 'fs' + (chip ? ' chip' : '') + (fixed ? ' fix' : '') +
                      (pos === E.FIXED_N ? ' cut' : '');
        d.innerHTML = '<span class="v">'+E.faceEmoji(faces[slot])+'</span>' +
                      (fixed ? '<span class="lk">🔒</span>' : '');
        if (!fixed) d.onclick = function(){ openSheet(di, slot); };
        fb.appendChild(d);
      });
      row.appendChild(fb);
      bar.appendChild(row);
    });

    // 在庫は「のこり/ぜんぶ」。9枠のうち何枠にチップを置いたかも1語で出す
    var inv = $('prep-inv'), all = E.startChips(id);
    inv.innerHTML = E.CHIP_ORDER.map(function(k){
      var n = save.chips[k];
      return '<span class="'+(n?'':'z')+'">'+E.CHIPS[k].emoji+'<b>'+n+'</b><i>/'+
             (n + countPlaced(id, k))+'</i></span>';
    }).join('');
    $('prep-used').textContent = placed + '/' + (E.DICE_N * E.CUSTOM_N) + '枠　のこり/ぜんぶ';

    // 出発の条件は「技4つ」だけ。9枠は既定の面で埋まっているので空きは無い
    $('go').disabled = sel.length !== 4;
    $('go').textContent = sel.length === 4 ? 'たたかう' : 'わざを' + (4 - sel.length) + 'つえらぶ';
  }

  // そのキャラの9枠に置いてあるチップの枚数（種類ごと）
  function countPlaced(id, kind){
    var n = 0;
    save.dice[id].forEach(function(row){
      row.forEach(function(c){ if (c === kind) n++; });
    });
    return n;
  }

  function toggleMove(i){
    var sel = save.moves[prepChar.id], at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1);
    else if (sel.length < 4) sel.push(i);   // 5つ目は入らない
    sel.sort(function(a,b){ return a-b; });
    drawPrep();
  }

  // チップ選択シート
  function openSheet(die, slot){
    if (E.isFixedSlot(slot)) return;      // 固定3面（属性×2＋✨）は差し替えられない
    sheetDie = die; sheetSlot = slot;
    var id = prepChar.id, cur = save.dice[id][die][slot];
    var bare = E.faceEmoji([prepChar.slots[slot]]);
    $('sheet-ttl').textContent = E.DICE_LABEL[die] + 'の面にはめるチップ（いまは ' +
      (cur ? E.faceEmoji(E.CHIPS[cur].face) + '・素の面は ' + bare : bare) + '）';
    var box = $('sheet-chips');
    box.innerHTML = '';
    E.CHIP_ORDER.forEach(function(k){
      var n = save.chips[k], on = (cur === k);
      // 上限（1個につき 属性3面・他のエネ2面）に触れる置き換えはグレーにして選ばせない。理由を短く出す
      var chk = on ? { ok: true } : E.canPlaceChip(prepChar, save.dice[id], die, slot, k);
      var disabled = (!n && !on) || !chk.ok;
      var d = document.createElement('div');
      d.className = 'chip' + (disabled ? ' z' : '') + (on ? ' on' : '');
      d.innerHTML = '<div class="v">'+E.CHIPS[k].emoji+'</div>'+
                    '<div class="k">'+(!chk.ok ? chk.reason : n+'まい')+'</div>';
      if (!disabled) d.onclick = function(){ setChip(k); };
      box.appendChild(d);
    });
    $('sheet-off').disabled = !cur;
    $('sheet').classList.add('on');
  }
  function closeSheet(){ $('sheet').classList.remove('on'); sheetDie = -1; sheetSlot = -1; }
  function setChip(k){
    var id = prepChar.id, cur = save.dice[id][sheetDie][sheetSlot];
    if (cur) save.chips[cur]++;      // 付け替え: 外したぶんは在庫に戻る（在庫は3個で共通）
    save.chips[k]--;
    save.dice[id][sheetDie][sheetSlot] = k;
    closeSheet(); drawPrep();
  }
  $('sheet-off').onclick = function(){
    var id = prepChar.id, cur = save.dice[id][sheetDie][sheetSlot];
    if (cur) { save.chips[cur]++; save.dice[id][sheetDie][sheetSlot] = null; }
    closeSheet(); drawPrep();
  };
  $('sheet-close').onclick = closeSheet;
  $('sheet').onclick = function(e){ if (e.target === $('sheet')) closeSheet(); };

  $('go').onclick = function(){
    if (save.moves[prepChar.id].length !== 4) return;
    writeSave();                              // 保存①: たたかう
    newBattle();
  };

  // ---------------- 3. バトル ----------------
  function stage(side){ return $(side === ME ? 'stage-me' : 'stage-foe'); }
  function lb(side){ return $(side === ME ? 'lb-me' : 'lb-foe'); }
  function res(side){ return $(side === ME ? 'res-me' : 'res-foe'); }
  function dchar(side){ return $(side === ME ? 'dchar-me' : 'dchar-foe'); }
  function dbox(side){ return $(side === ME ? 'denergy-me' : 'denergy-foe'); }
  function dimStage(active){
    stage(ME).classList.toggle('dim', active !== ME);
    stage(FOE).classList.toggle('dim', active !== FOE);
  }

  function newBattle(){
    var myId = save.run.charId, foeId = save.run.rest[0];
    // CPU周回強化（段2）は実測で効果が無く廃止（spec_v3.md §3.1）。CPUは常に★4技・素の面
    st = E.newState(myId, foeId, null, loadOf(myId), null);
    myF = st.chars[ME]; foeF = st.chars[FOE];
    logs = []; busy = (st.turn === FOE);
    [ME, FOE].forEach(function(s){
      res(s).textContent = '';
      lb(s).textContent = '';
      buildDice(s, st.chars[s]);   // 面構成から作り直す
      setEnergyActive(s, 3);
    });
    dimStage(st.turn);
    drawFighters(); drawMoves(); drawLog();
    show('s-battle');
    if (st.turn === FOE) { lb(FOE).textContent = '相手のばん'; setTimeout(foeTurn, 900); }
    else lb(ME).textContent = 'ねらう技を押すと転がる';
  }

  function drawFighters(){
    [[ 'f-me', ME, myF ], [ 'f-foe', FOE, foeF ]].forEach(function(p){
      var el = $(p[0]), side = p[1], c = p[2];
      el.querySelector('.em').textContent = c.emoji;
      el.querySelector('.n').textContent = c.name;
      el.querySelector('.at').textContent = E.attrLabel(c.attr);
      el.querySelector('.hpn').textContent = st.hp[side];
      var pct = Math.max(0, st.hp[side] / st.maxHp[side]) * 100;
      var bar = el.querySelector('.bar i');
      bar.style.width = pct + '%';
      bar.classList.toggle('low', pct <= 30);
      var b = [];
      if (st.halveNext[side]) b.push('つぎ半減');
      if (st.energyMinus[side]) b.push('つぎエネコロ-1');
      el.querySelector('.badge').textContent = b.join(' / ');
    });
  }

  // ---------------- 立方体ダイス ----------------
  // 面0=正面 1=裏 2=右 3=左 4=上 5=下。その面を正面に向ける回転 [x,y]
  var CUBE_REST = [[0,0],[0,180],[0,-90],[0,90],[-90,0],[90,0]];
  // 2026-09-04: 向きによる傾きは撤去。出た面はいつも正面・水平で止まる（傾けると目が読めない）
  function reduced(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function setCube(el, x, y, z){
    el._a = { x:x, y:y, z:z };
    el._cube.style.transform = 'rotateZ('+z+'deg) rotateX('+x+'deg) rotateY('+y+'deg)';
  }
  function makeCube(el, faceHtml, start){
    el.innerHTML = '';
    var cube = document.createElement('div');
    cube.className = 'cube';
    for (var i = 0; i < 6; i++){
      var f = document.createElement('div');
      f.className = 'f f' + i;
      f.innerHTML = faceHtml[i];
      cube.appendChild(f);
    }
    el.appendChild(cube);
    el._cube = cube;
    el.classList.remove('bnc');
    setCube(el, CUBE_REST[start||0][0], CUBE_REST[start||0][1], 0);
  }
  // 現在角から min 回転以上まわして、base と同じ向きで止まる角度
  // （360の整数倍は行列として同じなので、出目は変わらない）
  function spinTo(cur, base, turns){
    return base + Math.ceil((cur - base) / 360) * 360 + 360 * turns;
  }
  // faceIdx の面を正面・水平にして止める。zt=Z軸の回転数（タンブル演出）
  function rollCube(el, faceIdx, delay, dur, zt){
    var rest = CUBE_REST[faceIdx] || CUBE_REST[0], cube = el._cube;
    var x = rest[0], y = rest[1], z = 0;
    el.classList.remove('bnc');
    if (reduced()){                       // 回転を省いて即座に出目
      cube.style.transitionDelay = '0ms';
      setCube(el, x, y, z);
      return;
    }
    var a = el._a;
    x = spinTo(a.x, x, 2);
    y = spinTo(a.y, y, 3);
    z = spinTo(a.z, z, zt || 0);
    cube.style.transitionDuration = dur + 'ms';
    cube.style.transitionDelay = delay + 'ms';
    setCube(el, x, y, z);
    setTimeout(function(){                // 最後に小さくバウンド
      el.classList.remove('bnc'); void el.offsetWidth; el.classList.add('bnc');
    }, delay + dur - 30);
  }
  function enFaceHtml(f){
    return '<span class="' + (f.length > 1 ? 'two' : '') + '">' + E.faceEmoji(f) + '</span>';
  }
  function charFaceHtml(k){
    return '<span class="kj">' + oKan(k) + '</span>';
  }
  // 6面を小さく2段で。上段＝🔒固定3面（属性×2＋✨）／下段＝カスタム3面。ダイスの真下に出す
  function faceLines(faces){
    var e = E.SLOT_ORDER.map(function(i){ return E.faceEmoji(faces[i]); });
    return e.slice(0, E.FIXED_N).join('') + '<br>' + e.slice(E.FIXED_N).join('');
  }
  // 面構成（チップ差し替え込み）から立方体を作る。エネコロは3個それぞれ面が違う
  function buildDice(side, c){
    makeCube(dchar(side), c.die.map(charFaceHtml), 0);
    $(side === ME ? 'fl-me-c' : 'fl-foe-c').textContent = c.die.map(oKan).join('');
    var box = dbox(side);
    box.innerHTML = '';
    var arr = [];
    for (var i = 0; i < 3; i++){
      var col = document.createElement('div');
      col.className = 'dcol';
      var d = document.createElement('div');
      d.className = 'die en';
      var fl = document.createElement('div');
      fl.className = 'fl';
      fl.innerHTML = faceLines(c.energy[i]);
      col.appendChild(d); col.appendChild(fl);
      box.appendChild(col);
      makeCube(d, c.energy[i].map(enFaceHtml), i);
      arr.push(d);
    }
    box._dice = arr;   // 転がすときに使う（children は .dcol なので）
  }
  function enDice(side){ return dbox(side)._dice || []; }
  function setEnergyActive(side, n){
    enDice(side).forEach(function(d, i){
      d.parentNode.classList.toggle('off', i >= n);
    });
  }
  // 出目に合う面を選ぶ（同じ面が複数あるならランダム）
  function pickIdx(hits){
    return hits.length ? hits[Math.floor(Math.random() * hits.length)] : 0;
  }
  function charFaceIdx(c, orient){
    var h = [], i;
    for (i = 0; i < c.die.length; i++) if (c.die[i] === orient) h.push(i);
    return pickIdx(h);
  }
  function enFaceIdx(c, di, face){
    var h = [], i, faces = c.energy[di], sig = face.join('+');
    for (i = 0; i < faces.length; i++) if (faces[i].join('+') === sig) h.push(i);
    return pickIdx(h);
  }

  function drawMoves(){
    var box = $('moves');
    box.innerHTML = '';
    myF.moves.forEach(function(mv, i){
      var b = document.createElement('button');
      var used = (i === st.lastMove[ME]);
      b.className = 'mv' + (used ? ' used' : '');
      b.innerHTML = '<span class="n">' + mv.name + '</span>' +
        '<span class="c">' + mv.cost.map(en).join('') + ' <b>' + moveLabel(mv) + '</b>　' +
        '<em class="o">' + orientLabel(mv) + '</em></span>' + (used ? '<i class="tag">さっき使った</i>' : '');
      b.disabled = busy || st.over || st.turn !== ME || used;
      b.onclick = function(){ myTurn(i); };
      box.appendChild(b);
    });
  }

  function drawLog(){
    $('log').innerHTML = logs.slice(-3).map(function(t){ return '<div>' + t + '</div>'; }).join('');
  }

  function playTurn(side, moveIdx, done){
    var c = st.chars[side], mv = c.moves[moveIdx];
    var n = E.energyCount(st, side);
    lb(side).textContent = (side === ME ? '自分の' : '相手の') + '「' + mv.name + '」をねらう';
    res(side).textContent = '';
    dimStage(side);
    setEnergyActive(side, n);

    // 出目は先に engine が決め、その面が正面で止まるように転がす
    var r = E.resolveTurn(st, moveIdx);
    var rm = reduced(), dur = 520, step = 90;

    rollCube(dchar(side), charFaceIdx(c, r.orient), 0, dur, 1);
    enDice(side).forEach(function(d, i){
      if (i < r.n) rollCube(d, enFaceIdx(c, i, r.faces[i]), step * i, dur, 0);
    });

    setTimeout(function(){
      var line = describe(side, r);
      res(side).textContent = line;
      logs.push((side === ME ? '▶ ' : '◀ ') + line);
      var target = $(side === ME ? 'f-foe' : 'f-me');
      if (r.damage) { target.classList.remove('hit'); void target.offsetWidth; target.classList.add('hit'); }
      drawFighters(); drawLog();
      setTimeout(done, rm ? 600 : 620);
    }, rm ? 0 : dur + step * 2 + 30);
  }

  function describe(side, r){
    var mv = r.move, s = '';
    if (!r.success) {
      s = 'しずく… ' + r.damage + 'ダメージ';
      if (r.selfDamage) s += '　ロマンで自分に' + r.selfDamage;
      return s;
    }
    if (mv.kind === 'heal') s = mv.name + '！ ' + (r.heal ? r.heal + '回復' : 'まんたん！');
    else if (mv.kind === 'guard') s = mv.name + '！ つぎ半減';
    else s = mv.name + '！ ' + r.damage + 'ダメージ';
    if (r.adv) s += '　有利+' + E.ADV_BONUS;
    if (r.halved) s += '（半減）';
    if (r.orientHit) {
      s += '　' + oKan(r.orient) + 'ぴったり！';
      if (r.minus) s += ' 相手エネコロ-1';
      if (r.selfDamage) s += ' 自分に' + r.selfDamage;
      if (mv.kind === 'atk' && r.guard) s += ' つぎ半減';
      if (mv.kind !== 'heal' && r.heal) s += ' ' + r.heal + '回復';
    }
    return s;
  }

  function myTurn(i){
    if (busy || st.over || st.turn !== ME) return;
    busy = true; drawMoves();
    playTurn(ME, i, afterTurn);
  }
  function foeTurn(){
    if (st.over) { return afterTurn(); }
    var i = E.cpuChoose(st, FOE);
    playTurn(FOE, i, afterTurn);
  }
  function afterTurn(){
    if (st.over) return end();
    if (st.turn === FOE) {
      busy = true; drawMoves();
      lb(FOE).textContent = '相手のばん';
      dimStage(FOE);
      setTimeout(foeTurn, 1000);
    } else {
      busy = false;
      lb(ME).textContent = 'ねらう技をえらぶ';
      dimStage(ME);
      drawMoves();
    }
  }

  // ---------------- 4. 結果（＋蔵めぐりの報酬） ----------------
  function end(){
    var win = st.winner === ME;
    lastGot = [];
    if (win){
      lastGot.push(E.rollDrop(foeF, null));   // v6: 勝つたびに🌾🍚💧🔥のどれか1枚だけ（レア枠は廃止）
      save.run.wins++;
      save.run.rest.shift();
      lastGot.forEach(function(k){ save.chips[k]++; });
    } else {
      save.run = null;                                            // 負けたらその周は終了
    }
    writeSave();                                                  // 保存②: 結果画面の表示時

    $('end-em').textContent = win ? myF.emoji : foeF.emoji;
    var cleared = win && save.run && save.run.rest.length === 0;
    $('end-msg').textContent = cleared ? '1周クリア！' : (win ? 'かった！' : 'まけた…');
    $('end-got').innerHTML = win
      ? lastGot.map(function(k){ return E.CHIPS[k].emoji; }).join('と') + 'をもらった！'
      : '';
    $('end-dots').innerHTML = win ? '蔵めぐり ' + dots(save.run.wins) : '蔵めぐり ' + dots(0);
    $('again').textContent = win ? (cleared ? 'もう1周' : 'つぎへ') : 'もういちど';
    $('toselect').textContent = win ? 'やめる' : 'キャラ選択へ';
    show('s-end');
  }

  $('again').onclick = function(){
    if (!save.run) save.run = { charId: prepChar.id, rest: shuffled(), wins: 0, lap: 1 };  // 負けたあと・もういちど（周回はリセット）
    else if (save.run.rest.length === 0) save.run = { charId: save.run.charId, rest: shuffled(), wins: 0, lap: (save.run.lap || 1) + 1 }; // つぎの周
    goPrep();
  };
  $('toselect').onclick = function(){
    save.run = null; writeSave();
    drawSelect(); show('s-select');
  };

  // ---------------- 起動 ----------------
  drawSelect();
  show('s-select');
})();
</script>
</body>
</html>
